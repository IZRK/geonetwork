services:
  elasticsearch-permissions:
    image: alpine:3.20
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /data
        chown -R 1000:0 /data
        chmod -R ug+rwX /data
    volumes:
      - ./data/elasticsearch:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.13
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    depends_on:
      elasticsearch-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  geonetwork:
    image: izrk-geonetwork:4.4.13-SNAPSHOT
    restart: unless-stopped
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GEONETWORK_WAR: geonetwork.war
    environment:
      GEONETWORK_ES_PROTOCOL: http
      GEONETWORK_ES_HOST: elasticsearch
      GEONETWORK_ES_PORT: 9200
      GEONETWORK_PUBLIC_URL: ${GEONETWORK_PUBLIC_URL:-https://metadata.izrk.zrc-sazu.si}
      geonetwork_dir: /var/lib/geonetwork_data
    volumes:
      - ./data/geonetwork:/var/lib/geonetwork_data
      - ./data/geonetwork-home:/root
    ports:
      - "8081:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
