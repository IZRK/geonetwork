<div class="izrk-contact-name" data-ng-if="c.individual || c.position">
  {{c.individual}}
  <span data-ng-show="c.position">({{c.position}})</span>
</div>
<div data-ng-if="c.email">
  <a class="izrk-contact-email" data-ng-href="mailto:{{c.email}}">
    <i class="fa fa-fw fa-envelope-o" aria-hidden="true"></i>
    {{c.email}}
  </a>
</div>
<div data-ng-repeat="id in c.identifiers">
  <span data-ng-show="id.link == '' && id.code.indexOf('http') === -1">
    {{id.code || id.link}}
    <span data-ng-show="id.codeSpace">({{id.codeSpace}})</span>
  </span>
  <a data-ng-show="id.code.indexOf('http') === 0 && id.link == ''" href="{{id.code}}"
    >{{id.code}}
    <span data-ng-show="id.codeSpace != ''">({{id.codeSpace}})</span>
  </a>
  <a data-ng-show="id.link != ''" href="{{id.link}}"
    >{{id.code || id.link}}
    <span data-ng-show="id.codeSpace != ''">({{id.codeSpace}})</span>
  </a>
</div>
