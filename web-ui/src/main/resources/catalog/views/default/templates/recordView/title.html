<div class="izrk-record-title">
  <div class="izrk-resource-type">
    <i
      class="fa gn-icon-{{mdView.current.record.resourceType[0]}}"
      aria-hidden="true"
    ></i>
    <span>{{mdView.current.record.resourceType[0] | translate}}</span>
  </div>
  <h1 class="gn-break">
    {{mdView.current.record.resourceTitle}}

    <span
      class="text-muted badge"
      data-ng-class="{
              'text-success': mdView.current.record.mdStatus == 2,
              'text-warning': mdView.current.record.mdStatus == 4
              }"
      data-ng-if="user.isEditorOrMore()
                      && mdView.current.record.mdStatus < 50
                      && isMdWorkflowEnable"
      >{{('status-' + mdView.current.record.mdStatus) | translate}}</span
    >
  </h1>

  <div
    class="gn-alt-title"
    data-ng-if="mdView.current.record.resourceAltTitle.length > 0"
  >
    <span data-translate="">alternateTitle</span>
    {{mdView.current.record.resourceAltTitle.join(', ')}}
  </div>

  <div
    data-ng-if="['series', 'service'].indexOf(mdView.current.record.resourceType[0]) !== -1
                    && mdView.current.record.related"
    data-gn-record-mosaic=""
    records="mdView.current.record.related.all"
    size="8"
  ></div>

  <div
    data-ng-if="mdView.current.record.related.uuids"
    data-gn-related="mdView.current.record"
    data-user="user"
    data-alt-title="{{'memberOf' | translate}}"
    data-layout="title"
    data-types="parent"
  ></div>

  <div class="izrk-abstract" data-ng-init="abstractState = {expanded: false}">
    <p
      id="izrk-record-abstract"
      data-ng-class="{'izrk-abstract-collapsed': mdView.current.record.resourceAbstract.length > 1600 && !abstractState.expanded}"
      data-ng-bind-html="mdView.current.record.resourceAbstract | linky | newlines"
    ></p>
    <button
      type="button"
      class="btn btn-default izrk-abstract-toggle"
      data-ng-if="mdView.current.record.resourceAbstract.length > 1600"
      data-ng-click="abstractState.expanded = !abstractState.expanded"
      aria-expanded="{{abstractState.expanded}}"
      aria-controls="izrk-record-abstract"
    >
      <span>{{(abstractState.expanded ? 'showLess' : 'readMore') | translate}}</span>
      <i
        class="fa"
        data-ng-class="abstractState.expanded ? 'fa-angle-up' : 'fa-angle-down'"
        aria-hidden="true"
      ></i>
    </button>
  </div>
</div>
